<body data-mode="web" data-switch="web" data-page="home" data-game-only="">
  <!-- a restart (game.js's startOver), or a link with ?play, reloads into the game: the website's kept hidden from the
       first paint, not shown till main.js has loaded (main.js clears the note). dos-age.com is the game
       alone: no website, no way to it (the Worker puts data-game-only on the body, see worker/index.js GAME_HOST) -->
  <script>try { if (sessionStorage.getItem("mektxt.restart") === "1" || /[?&]play(&|=|$)/.test(location.search) || "gameOnly" in document.body.dataset) document.body.dataset.mode = document.body.dataset.switch = "game"; } catch {}</script>
  <div id="game"><canvas id="screen" aria-label="mektxt game"></canvas>
    <!-- Loading (the user's pick B, 2026-10-28): five forest-1 trees felled and growing back in a wave,
         over the game till its first frame (game.js takes it away), its replay fetched too; the seven
         tiles (tree, two hits, stump, sprout, sapling, young tree) are here, as tiles.png is what's loading,
         a step brighter than the game's (#663931 > #8f563b, #524b24 > #8a6f30, the user's, 2026-10-28);
         game.js GROWING draws the same on the leaderboard -->
    <div id="loading" aria-label="Loading"><canvas width="50" height="12"></canvas></div>
    <script>(() => {
      const box = document.getElementById("loading"), c = box.firstElementChild, x = c.getContext("2d"), img = new Image();
      const seq = [[0, 500], [1, 110], [2, 110], [3, 260], [4, 200], [5, 200], [6, 200]], total = 1580, lag = 170;
      const frameAt = t => { t = ((t % total) + total) % total; for (const [f, ms] of seq) { if (t < ms) return f; t -= ms; } return 0; };
      const draw = t => { if (!box.isConnected) return; x.clearRect(0, 0, 50, 12);
        for (let i = 0; i < 5; i++) x.drawImage(img, frameAt(t - i * lag) * 8, 0, 8, 12, 1 + i * 10, 0, 8, 12);
        requestAnimationFrame(draw); };
      img.onload = () => requestAnimationFrame(draw);
      img.src = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADgAAAAMCAYAAAA3bX6lAAAAt0lEQVR42mNkF1b5zzCMARO6QHMMD0NzDM/w8yC6x3B5crAHALrbmPB5ZqgCZP8wEathoGMYZiY+e4nKgzBQu+QLXgsJyVMb1C75wtAcw4PXXmyeZMLlWGTFhORJycOkOI7UAMDGZqJnLHQ4ixOMIXweRlaDSx5nHoRJotPUkEf3GDofW2pANx/d8/jkccYgoXROrnzF3pckxR45anDJ0y2JVux9SXGhRU7Bx0ROUUyuPL3qP2T7AWxZgMn0buuDAAAAAElFTkSuQmCC";
    })();</script>
